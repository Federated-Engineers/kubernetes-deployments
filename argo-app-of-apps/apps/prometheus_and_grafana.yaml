apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'prometheus-grafana'
  namespace: argocd
  labels:
    name: 'prometheus-grafana'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:  
    - argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/Federated-Engineers/kubernetes-deployments.git
    targetRevision: appset-test
    path: 'application-deployments/charts/kube-prometheus-stack'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true